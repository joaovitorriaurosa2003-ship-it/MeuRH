function slugify(text) {
  return text.toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-');
}
function formatDate(ts) {
  if (!ts) return '-';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function formatDateTime(ts) {
  if (!ts) return '-';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

// Calcula score médio de uma subescala dado objeto de respostas {0:val, 1:val, ...} (índice 0-based)
function calcCopsoqSubescala(respostas, subescala) {
  const vals = subescala.itens.map(n => respostas[n-1]).filter(v => v !== undefined && v !== null);
  if (!vals.length) return null;
  const media = vals.reduce((a,b) => a+b, 0) / vals.length;
  return Math.round(media * 10) / 10;
}

// Calcula % por dimensão (D/I/S/C) a partir dos ids selecionados
function calcDiscScores(idsSelecionados){
  const contagem={D:0,I:0,S:0,C:0};
  (idsSelecionados||[]).forEach(id=>{
    const p=DISC_PALAVRAS.find(w=>w.id===id);
    if(p)contagem[p.dim]++;
  });
  const total=Object.values(contagem).reduce((a,b)=>a+b,0)||1;
  const pct={};
  Object.keys(contagem).forEach(k=>{pct[k]=Math.round(contagem[k]/total*100);});
  const dominante=Object.entries(contagem).sort((a,b)=>b[1]-a[1])[0][0];
  return{contagem,pct,dominante,total:Object.values(contagem).reduce((a,b)=>a+b,0)};
}

function calcDiscTalento(pct){
  const ordenado=Object.entries(pct).sort((a,b)=>b[1]-a[1]);
  const primario=ordenado[0][0],secundario=ordenado[1][0];
  const gap=ordenado[0][1]-ordenado[1][1];
  // Perfil muito concentrado numa única letra (gap grande) → talento "puro"
  const chave=gap>=25?primario:`${primario}+${secundario}`;
  return{chave,primario,secundario,gap,...(DISC_TALENTOS[chave]||DISC_TALENTOS[primario])};
}

/* ============== DISC — ÍNDICES SITUACIONAIS (derivados das duas fases) ============== */
function calcDiscIndicadores(respostaDisc){
  const auto=calcDiscScores(respostaDisc?.auto);
  const hetero=calcDiscScores(respostaDisc?.hetero);
  const totalPalavras=40;

  // Energia: quantas palavras selecionou na fase Auto, proporcional ao banco total
  const energia=Math.min(100,Math.round((auto.total/ (totalPalavras*0.5))*100));

  // Exigência do meio: diferença entre o perfil dominante Auto e Hetero
  const gapDominante=Math.abs((auto.pct[auto.dominante]||0)-(hetero.pct[auto.dominante]||0));
  const mudouDominante=auto.dominante!==hetero.dominante;
  const exigencia=Math.min(100,Math.round(gapDominante*1.5+(mudouDominante?25:0)));

  // Autoconfiança: intensidade da dimensão dominante Auto (quanto mais concentrado, mais confiante)
  const autoconfianca=Math.min(100,auto.pct[auto.dominante]||0);

  // Autoestima: consistência entre Auto e Hetero (perfis parecidos = autoimagem estável)
  const diffTotal=['D','I','S','C'].reduce((s,k)=>s+Math.abs((auto.pct[k]||0)-(hetero.pct[k]||0)),0);
  const autoestima=Math.max(0,100-Math.round(diffTotal/2));

  // Flexibilidade: inverso da concentração — perfil distribuído entre as 4 letras = mais flexível
  const valores=['D','I','S','C'].map(k=>auto.pct[k]||0);
  const media=25;
  const desvio=valores.reduce((s,v)=>s+Math.abs(v-media),0)/4;
  const flexibilidade=Math.max(0,100-Math.round(desvio*2));

  // Amplitude: total de palavras somadas nas duas fases
  const amplitude=Math.min(100,Math.round(((auto.total+hetero.total)/(totalPalavras*0.8))*100));

  // Automotivação: força da dimensão secundária Auto
  const ordenadoAuto=Object.entries(auto.pct).sort((a,b)=>b[1]-a[1]);
  const automotivacao=Math.min(100,(ordenadoAuto[1]?.[1]||0)*2);

  // Incitabilidade: (D+I) - (S+C), normalizado — D/I reagem rápido, S/C são mais ponderados
  const rapidas=(auto.pct.D||0)+(auto.pct.I||0);
  const ponderadas=(auto.pct.S||0)+(auto.pct.C||0);
  const incitabilidade=Math.max(0,Math.min(100,Math.round(50+(rapidas-ponderadas)/2)));

  return{energia,exigencia,autoconfianca,autoestima,flexibilidade,amplitude,automotivacao,incitabilidade};
}

function calcularPerfil(escolhas) {
  const pontos={aguia:0,golfinho:0,lobo:0,tubarao:0};
  escolhas.forEach((opcaoIdx,pergIdx)=>{const op=PERGUNTAS_PERFIL[pergIdx]?.opcoes[opcaoIdx];if(op)pontos[op.perfil]+=1;});
  const totalPerguntas=escolhas.length||10;
  const pct={};Object.keys(pontos).forEach(k=>{pct[k]=Math.round(pontos[k]/totalPerguntas*100);});
  const dominante=Object.entries(pontos).sort((a,b)=>b[1]-a[1])[0][0];
  return{pontos,pct,dominante};
}

function discRadarSVG(pctAuto,pctHetero,size){
  size=size||220;
  var cx=size/2,cy=size/2,r=size*0.30;
  var ordem=['D','I','S','C'];
  var n=4,angBase=-Math.PI/2;

  function ptsFor(pct){
    return ordem.map(function(k,i){
      var ang=angBase+2*Math.PI*i/n;
      var val=(pct[k]||0)/100;
      return{x:cx+r*val*Math.cos(ang),y:cy+r*val*Math.sin(ang)};
    });
  }

  var grades=[0.25,0.5,0.75,1].map(function(frac){
    var gpts=ordem.map(function(_,i){
      var ang=angBase+2*Math.PI*i/n;
      return(cx+r*frac*Math.cos(ang)).toFixed(1)+','+(cy+r*frac*Math.sin(ang)).toFixed(1);
    }).join(' ');
    return'<polygon points="'+gpts+'" fill="none" stroke="#e5e0d8" stroke-width="0.6"/>';
  }).join('');

  var eixos=ordem.map(function(_,i){
    var ang=angBase+2*Math.PI*i/n;
    return'<line x1="'+cx.toFixed(1)+'" y1="'+cy.toFixed(1)+'" x2="'+(cx+r*Math.cos(ang)).toFixed(1)+'" y2="'+(cy+r*Math.sin(ang)).toFixed(1)+'" stroke="#ccc" stroke-width="0.7"/>';
  }).join('');

  var ptsAuto=ptsFor(pctAuto);
  var ptsHetero=ptsFor(pctHetero);

  var areaHetero='<polygon points="'+ptsHetero.map(function(p){return p.x.toFixed(1)+','+p.y.toFixed(1);}).join(' ')+'" fill="#7B5FC422" stroke="#7B5FC488" stroke-width="1.6" stroke-dasharray="3,2"/>';
  var areaAuto='<polygon points="'+ptsAuto.map(function(p){return p.x.toFixed(1)+','+p.y.toFixed(1);}).join(' ')+'" fill="#7B5FC433" stroke="#7B5FC4" stroke-width="2"/>';

  var pontosAuto=ptsAuto.map(function(p){return'<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3.2" fill="#7B5FC4"/>';}).join('');
  var pontosHetero=ptsHetero.map(function(p){return'<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="2.6" fill="#fff" stroke="#7B5FC4" stroke-width="1.4"/>';}).join('');

  var labelOff=28;
  var labelsHTML=ordem.map(function(k,i){
    var p=PERFIS_DISC[k];
    var ang=angBase+2*Math.PI*i/n;
    var lx=cx+(r+labelOff)*Math.cos(ang);
    var ly=cy+(r+labelOff)*Math.sin(ang);
    var anchor=Math.cos(ang)>0.15?'start':Math.cos(ang)<-0.15?'end':'middle';
    // Sem emoji: wkhtmltopdf renderiza emoji com largura instável, causando sobreposição de labels em radares pequenos
    return'<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="'+anchor+'" dominant-baseline="middle" font-size="12" font-weight="bold" fill="'+p.cor+'" font-family="Arial">'+k+'</text>';
  }).join('');

  return'<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" xmlns="http://www.w3.org/2000/svg">'
    +grades+eixos+areaHetero+areaAuto+pontosHetero+pontosAuto+labelsHTML
    +'</svg>';
}

// Gráfico de linha comparando Perfil Atual, Exigência do meio e Força de Adaptação
// Conceito clássico de teoria DISC (perfil interno x ambiente x adaptação) — fórmula e design próprios
function discLinhaComparativa(pctAuto,pctHetero,width,height){
  width=width||420;height=height||220;
  var pad={top:24,bottom:30,left:36,right:16};
  var W=width-pad.left-pad.right,H=height-pad.top-pad.bottom;
  var ordem=['D','I','S','C'];
  var baseline=25; // 100%/4 dimensões = ponto neutro
  var minV=-25,maxV=25;

  function serieValores(tipo){
    return ordem.map(function(k){
      var a=(pctAuto[k]||0)-baseline;
      var h=(pctHetero[k]||0)-baseline;
      if(tipo==='atual')return a;
      if(tipo==='exigencia')return h;
      return (a+h)/2; // Força de adaptação = ponto médio entre autopercepção e ambiente
    });
  }
  function yPos(v){return pad.top+H-((v-minV)/(maxV-minV))*H;}
  function xPos(i){return pad.left+(i/(ordem.length-1))*W;}

  var grades=[minV,minV/2,0,maxV/2,maxV].map(function(v){
    var y=yPos(v);
    return '<line x1="'+pad.left+'" y1="'+y.toFixed(1)+'" x2="'+(width-pad.right)+'" y2="'+y.toFixed(1)+'" stroke="'+(v===0?'#ccc':'#eee')+'" stroke-width="'+(v===0?1.2:0.6)+'"/>'
      +'<text x="'+(pad.left-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" font-size="8" fill="#999" font-family="Arial">'+v+'</text>';
  }).join('');

  var xLabels=ordem.map(function(k,i){
    var p=PERFIS_DISC[k];
    return '<text x="'+xPos(i).toFixed(1)+'" y="'+(height-pad.bottom+16)+'" text-anchor="middle" font-size="9" font-weight="bold" fill="'+p.cor+'" font-family="Arial">'+k+'</text>';
  }).join('');

  function linha(tipo,cor,dash,marcador){
    var vals=serieValores(tipo);
    var pts=vals.map(function(v,i){return xPos(i).toFixed(1)+','+yPos(v).toFixed(1);}).join(' ');
    var linhaSvg='<polyline points="'+pts+'" fill="none" stroke="'+cor+'" stroke-width="1.8"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>';
    var pontosSvg=vals.map(function(v,i){
      var x=xPos(i),y=yPos(v);
      if(marcador==='circle')return '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3.4" fill="'+cor+'"/>';
      if(marcador==='square')return '<rect x="'+(x-3).toFixed(1)+'" y="'+(y-3).toFixed(1)+'" width="6" height="6" fill="'+cor+'"/>';
      return '<polygon points="'+x.toFixed(1)+','+(y-3.6).toFixed(1)+' '+(x-3.4).toFixed(1)+','+(y+2.8).toFixed(1)+' '+(x+3.4).toFixed(1)+','+(y+2.8).toFixed(1)+'" fill="'+cor+'"/>';
    }).join('');
    return linhaSvg+pontosSvg;
  }

  var linhaAtual=linha('atual','#7B5FC4',null,'circle');
  var linhaExigencia=linha('exigencia','#E05C4A','4,2','square');
  var linhaAdaptacao=linha('adaptacao','#555','1,2','triangle');

  return '<svg width="'+width+'" height="'+height+'" viewBox="0 0 '+width+' '+height+'" xmlns="http://www.w3.org/2000/svg">'
    +grades+xLabels+linhaExigencia+linhaAdaptacao+linhaAtual
    +'</svg>';
}

function gerarPDFTarefa(tarefa,respostas,empresaNome){

  const empresaNome=id=>empresas.find(e=>e.id===id)?.nome||'-';

// Tela de login/cadastro do colaborador
function AuthColaborador({empresa,onAutenticado}){
  const [modo,setModo]=useState('login'); // 'login' | 'cadastro'
  const [email,setEmail]=useState('');
  const [senha,setSenha]=useState('');
  const [confirmaSenha,setConfirmaSenha]=useState('');
  const [erro,setErro]=useState('');
  const [loading,setLoading]=useState(false);

  const handleLogin=async()=>{
    if(!email.trim()||!senha)return;
    setErro('');setLoading(true);
    try{
      const cred=await auth.signInWithEmailAndPassword(email.trim(),senha);
      // Verificar se este usuário pertence a esta empresa
      const doc=await db.collection('employees').doc(cred.user.uid).get();
      if(!doc.exists||doc.data().companyId!==empresa.id){
        await auth.signOut();
        setErro('Esta conta não pertence a '+empresa.nome+'. Verifique o link de acesso.');
        setLoading(false);return;
      }
      onAutenticado(cred.user,doc.data());
    }catch(e){
      if(e.code==='auth/user-not-found'||e.code==='auth/wrong-password'||e.code==='auth/invalid-credential')setErro('E-mail ou senha incorretos.');
      else setErro('Erro ao entrar. Tente novamente.');
    }
    setLoading(false);
  };

  const handleCadastro=async()=>{
    if(!email.trim()||!senha||senha!==confirmaSenha){setErro(senha!==confirmaSenha?'As senhas não coincidem.':'Preencha todos os campos.');return;}
    if(senha.length<6){setErro('A senha precisa ter pelo menos 6 caracteres.');return;}
    setErro('');setLoading(true);
    try{
      // Verificar se já existe um employee com esse email nessa empresa
      const existente=await db.collection('employees').where('email','==',email.trim().toLowerCase()).where('companyId','==',empresa.id).get();
      if(!existente.empty){setErro('Já existe uma conta com este e-mail nesta empresa.');setLoading(false);return;}
      const cred=await auth.createUserWithEmailAndPassword(email.trim(),senha);
      // Criar documento base do employee (perfil incompleto)
      await db.collection('employees').doc(cred.user.uid).set({
        email:email.trim().toLowerCase(),companyId:empresa.id,
        perfilCompleto:false,ativo:true,dataCadastro:firebase.firestore.FieldValue.serverTimestamp()
      });
      onAutenticado(cred.user,{email:email.trim().toLowerCase(),companyId:empresa.id,perfilCompleto:false,ativo:true});
    }catch(e){
      if(e.code==='auth/email-already-in-use')setErro('Já existe uma conta com este e-mail. Faça login.');
      else if(e.code==='permission-denied'||e.message?.includes('permission'))setErro('Erro de permissão no banco. Verifique as regras do Firestore.');
      else setErro('Erro ao criar conta: '+(e.message||e.code||'desconhecido'));
    }
    setLoading(false);
  };

  const inp={width:'100%',background:'#fff',border:'1px solid #e2e5ec',borderRadius:12,padding:'14px 16px',color:'#1a1d2e',fontSize:15,fontFamily:'inherit',outline:'none',marginBottom:12,boxSizing:'border-box'};

  return React.createElement("div",{style:{minHeight:'100vh',background:'#f8f9fb',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:24}},
    React.createElement("div",{style:{width:'100%',maxWidth:400}},
      // Cabeçalho
      React.createElement("div",{style:{textAlign:'center',marginBottom:28}},
        React.createElement("div",{style:{fontSize:12,color:'#b8976a',fontWeight:700,letterSpacing:2,marginBottom:16}},"INSTITUTO PROPAGARE"),
        React.createElement("div",{style:{fontSize:44,marginBottom:12}},"🏢"),
        React.createElement("h2",{style:{color:'#1a1d2e',fontSize:22,margin:'0 0 4px',fontWeight:800}},empresa.nome),
        React.createElement("p",{style:{color:'#6b7280',fontSize:13,margin:0}},"Portal do Colaborador")
      ),
      // Toggle login/cadastro
      React.createElement("div",{style:{display:'flex',background:'#e2e5ec',borderRadius:10,padding:3,marginBottom:20}},
        ['login','cadastro'].map(m=>React.createElement("button",{key:m,onClick:()=>{setModo(m);setErro('');},style:{flex:1,background:modo===m?'#fff':'transparent',border:'none',borderRadius:8,padding:'9px',cursor:'pointer',fontSize:13,fontWeight:modo===m?700:400,color:modo===m?'#1a1d2e':'#6b7280',transition:'all .15s'}},m==='login'?'Entrar':'Criar conta'))
      ),
      // Campos
      React.createElement("label",{style:{display:'block',fontSize:11,color:'#6b7280',fontWeight:600,textTransform:'uppercase',marginBottom:5}},"E-mail"),
      React.createElement("input",{value:email,onChange:e=>setEmail(e.target.value),type:"email",placeholder:"seu@email.com",style:inp,autoFocus:true,onKeyDown:e=>e.key==='Enter'&&(modo==='login'?handleLogin():null)}),
      React.createElement("label",{style:{display:'block',fontSize:11,color:'#6b7280',fontWeight:600,textTransform:'uppercase',marginBottom:5}},"Senha"),
      React.createElement("input",{value:senha,onChange:e=>setSenha(e.target.value),type:"password",placeholder:modo==='cadastro'?'Mínimo 6 caracteres':'Sua senha',style:inp,onKeyDown:e=>e.key==='Enter'&&(modo==='login'?handleLogin():null)}),
      modo==='cadastro'&&React.createElement(React.Fragment,null,

// Fluxo público com autenticação
function FluxoPublico({slug}){
  const [empresa,setEmpresa]=useState(null);
  const [loadingEmpresa,setLoadingEmpresa]=useState(true);
  const [authUser,setAuthUser]=useState(undefined);
  const [employeeData,setEmployeeData]=useState(null);
  const [employeeChecked,setEmployeeChecked]=useState(false);

  useEffect(()=>{
    db.collection('companies').where('slug','==',slug).limit(1).get().then(snap=>{
      if(!snap.empty)setEmpresa({id:snap.docs[0].id,...snap.docs[0].data()});
      setLoadingEmpresa(false);
    }).catch(()=>setLoadingEmpresa(false));
  },[slug]);

  useEffect(()=>{
    const unsub=auth.onAuthStateChanged(u=>{
      setAuthUser(u||null);
      if(!u){setEmployeeData(null);setEmployeeChecked(true);} // não logado → já resolvido
    });
    return unsub;
  },[]);

  // Buscar employee apenas quando authUser E empresa estiverem prontos
  useEffect(()=>{
    if(!authUser||!empresa)return;
    setEmployeeChecked(false);
    db.collection('employees').doc(authUser.uid).get()
      .then(doc=>{setEmployeeData(doc.exists?doc.data():null);setEmployeeChecked(true);})
      .catch(()=>{setEmployeeData(null);setEmployeeChecked(true);});
  },[authUser?.uid,empresa?.id]);

  const handleAutenticado=(user,data)=>{setAuthUser(user);setEmployeeData(data);setEmployeeChecked(true);};
  const handlePerfilCompleto=(patch)=>{setEmployeeData(d=>({...d,...patch}));};
  const handleLogout=async()=>{await auth.signOut();setAuthUser(null);setEmployeeData(null);setEmployeeChecked(false);};

  const mobileWrap={minHeight:'100vh',background:'#f8f9fb',fontFamily:"'Segoe UI',system-ui,sans-serif"};
  const Spin=({msg})=>React.createElement("div",{style:{...mobileWrap,display:'flex',alignItems:'center',justifyContent:'center'}},
    React.createElement("div",{style:{textAlign:'center'}},
      React.createElement("div",{style:{fontSize:32,marginBottom:12}},"🧠"),
      React.createElement("div",{style:{color:'#b8976a',fontWeight:600,fontSize:14}},msg)
    )
  );

  if(loadingEmpresa||authUser===undefined) return React.createElement(Spin,{msg:"Carregando..."});
  if(!empresa) return React.createElement("div",{style:{...mobileWrap,display:'flex',alignItems:'center',justifyContent:'center',padding:24}},
    React.createElement("div",{style:{textAlign:'center'}},React.createElement("div",{style:{fontSize:48,marginBottom:16}},"❌"),React.createElement("h2",{style:{color:'#1a1d2e',marginBottom:8}},"Link inválido"),React.createElement("p",{style:{color:'#6b7280'}},"Empresa não encontrada."))
  );
  // Não logado — employeeChecked é true aqui (setado no onAuthStateChanged quando u=null)
  if(!authUser) return React.createElement(AuthColaborador,{empresa,onAutenticado:handleAutenticado});
  // Logado mas ainda buscando dados

/* ---- TELA DE ENTRADA DE CÓDIGO DA EMPRESA (colaborador sem link direto) ---- */
function EntradaCodigoEmpresa(){
  const [codigo,setCodigo]=useState('');
  const [verificando,setVerificando]=useState(false);
  const [erro,setErro]=useState('');

  const normalizarCodigo=v=>v.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,20);

  const handleEntrar=async()=>{
    const codigoFinal=normalizarCodigo(codigo);
    if(codigoFinal.length<3){setErro('Digite um código válido.');return;}
    setVerificando(true);setErro('');
    try{
      const snap=await db.collection('companies').where('slug','==',codigoFinal).limit(1).get();
      if(snap.empty){
        setErro('Código não encontrado. Verifique com o RH da sua empresa.');
        setVerificando(false);return;
      }
      const novaUrl=window.location.pathname+'?colaborador&empresa='+codigoFinal;
      window.history.replaceState({},'',novaUrl);
      window.location.reload();
    }catch(e){
      setErro('Erro ao verificar o código. Tente novamente.');
      setVerificando(false);
    }
  };

  const inp={width:'100%',background:'#fff',border:'1.5px solid #e2e5ec',borderRadius:12,padding:'16px',color:'#1a1d2e',fontSize:20,fontFamily:'monospace',fontWeight:700,letterSpacing:2,textAlign:'center',outline:'none',textTransform:'uppercase',boxSizing:'border-box'};

  return React.createElement("div",{style:{minHeight:'100vh',background:'#f8f9fb',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:24}},
    React.createElement("div",{style:{width:'100%',maxWidth:380}},
      React.createElement("div",{style:{textAlign:'center',marginBottom:32}},
        React.createElement("div",{style:{fontSize:12,color:'#b8976a',fontWeight:700,letterSpacing:2,marginBottom:16}},"INSTITUTO PROPAGARE"),
        React.createElement("div",{style:{fontSize:44,marginBottom:12}},"🔑"),
        React.createElement("h2",{style:{color:'#1a1d2e',fontSize:21,margin:'0 0 6px',fontWeight:800}},"Portal do Colaborador"),
        React.createElement("p",{style:{color:'#6b7280',fontSize:13,margin:0}},"Digite o código de acesso fornecido pela sua empresa")
      ),
      React.createElement("input",{
        value:codigo,
        onChange:e=>{setCodigo(e.target.value);setErro('');},
        onKeyDown:e=>e.key==='Enter'&&handleEntrar(),
        placeholder:"CÓDIGO",
        style:inp,
        autoFocus:true,
        maxLength:20
      }),
      erro&&React.createElement("div",{style:{background:'#fef2f2',border:'1px solid #fecaca',borderRadius:8,padding:'10px 14px',marginTop:14,fontSize:13,color:'#e05c4a',textAlign:'center'}},erro),
      React.createElement("button",{
        onClick:handleEntrar,
        disabled:verificando||!codigo.trim(),
        style:{width:'100%',background:'#b8976a',color:'#2e1a00',border:'none',borderRadius:12,padding:'14px',fontSize:15,fontWeight:800,cursor:'pointer',marginTop:16,opacity:verificando||!codigo.trim()?.6:1}
      },verificando?'Verificando...':'Acessar →'),
      React.createElement("p",{style:{textAlign:'center',fontSize:11,color:'#9ca3af',marginTop:20}},"Não tem o código? Fale com o RH ou seu gestor.")
    )
  );
}

function App(){
  const [user,setUser]=useState(undefined);
  const params=new URLSearchParams(window.location.search);
  const empresaSlug=params.get('empresa');
  const isColaborador=params.has('colaborador');
  const salaCode=params.get('sala');

  useEffect(()=>{
    // Injetar CSS mobile quando no portal do colaborador
    if(isColaborador){
      document.title='Portal do Colaborador · Propagare';
      const meta=document.querySelector('meta[name=theme-color]')||document.createElement('meta');
      meta.name='theme-color';meta.content='#f5f6fa';document.head.appendChild(meta);
      // CSS mobile-first dedicado
      const style=document.createElement('style');
      style.id='mobile-portal-css';
      style.textContent=`
        body{background:#f5f6fa!important;-webkit-tap-highlight-color:transparent;}
        *{-webkit-font-smoothing:antialiased;}
        input,textarea,select,button{font-family:'Segoe UI',system-ui,sans-serif;}
        button:active{transform:scale(.97);}
        input[type=range]{-webkit-appearance:none;appearance:none;height:8px;border-radius:4px;background:#e2e5ec;outline:none;}
        input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;background:#2563eb;cursor:pointer;box-shadow:0 2px 6px rgba(37,99,235,.4);}
        input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#2563eb;cursor:pointer;border:none;box-shadow:0 2px 6px rgba(37,99,235,.4);}
        @media(max-width:480px){
          body{font-size:15px;}
        }
      `;
      document.head.appendChild(style);
    }
  },[isColaborador]);

  useEffect(()=>{const unsub=auth.onAuthStateChanged(u=>setUser(u));return unsub;},[]);

  // Portal do colaborador — detecta tanto ?colaborador&empresa=slug quanto ?empresa=slug (legacy)
  if(isColaborador&&empresaSlug)return React.createElement(FluxoPublico,{slug:empresaSlug});
  // ?colaborador sem código → tela para digitar o código da empresa manualmente
  if(isColaborador&&!empresaSlug)return React.createElement(EntradaCodigoEmpresa,null);
  // Legacy: link antigo sem ?colaborador — redireciona para nova URL
  if(!isColaborador&&empresaSlug){
    const novaUrl=window.location.pathname+'?colaborador&empresa='+empresaSlug;
    window.history.replaceState({},'',novaUrl);
    return React.createElement(FluxoPublico,{slug:empresaSlug});
  }
  if(user===undefined)return React.createElement("div",{style:{minHeight:'100vh',background:'#f8f9fb',display:'flex',alignItems:'center',justifyContent:'center'}},React.createElement("div",{style:{color:'#b8976a'}},"Carregando..."));
  if(!user)return React.createElement(LoginScreen,null);
  return React.createElement(PainelAdmin,{user});
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App,null));
</script>
